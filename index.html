<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boot.Dev progress calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Germania+One&family=New+Rocker&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Germania+One&family=New+Rocker&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <div class="title-sec gold-text">
      <h1>Boot.Dev Complete Calculator</h1>
      <p>Calculate your estimated time to finish!</p>
    </div>
    <section>
      <div class="calculator">
        <div class="body metallic-border">
          <label for="paths">Select Path</label>
          <select class="path-options" name="paths" id="paths">
            <option value="Back-end (Python & Go)">
              Back-end (Python & Go)
            </option>
            <option value="Back-end (Python & TypeScript)">
              Back-end (Python & TypeScript)
            </option>
            <option value="DevOps (Python & Go)">DevOps (Python & Go)</option>
          </select>
          <label for="courses">Select Completed Courses</label>
          <div class="courses"></div>
          <div class="lessons">
            <div class="remaining-courses">Lessons</div>
            <div class="values">
              <div>Total: <span class="total-lessons">110</span></div>
              <div>Remaining: <span class="remaining-lessons">2133</span></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
