<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boot.Dev progress calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Germania+One&family=New+Rocker&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Germania+One&family=New+Rocker&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <div class="calc">
    <div class="title-sec gold-text">
      <h1>Boot.Dev Completion Calculator</h1>
      <p>Calculate your estimated time to finish!</p>
    </div>
    <section>
      <div class="calculator">
        <div class="body metallic-border">
          <label for="paths">Select Path</label>
          <select class="path-options" name="paths" id="paths">
            <option value="Back-end (Python & Go)">
              Back-end (Python & Go)
            </option>
            <option value="Back-end (Python & TypeScript)">
              Back-end (Python & TypeScript)
            </option>
            <option value="DevOps (Python & Go)">DevOps (Python & Go)</option>
          </select>
          <label for="courses">Select Completed Courses</label>
          <div class="courses"></div>
          <div class="lessons">
          <div class="title">Lessons</div>            
          <div class="values">
            <div>Total: <span class="total-lessons">110</span></div>
            <div>Remaining: <input type="text" inputmode="numeric" pattern="[0-9]*" class="remaining-lessons" maxlength="4"></input></div>
          </div>
          </div>
        <div>Enter your daily average: <input type="text" inputmode="numeric" pattern="[0-9]*" class="daily-average" maxlength="4"></div>
        <div class="button silver-button">Get Idealistic Estimate</div>
        <div class="estimate hidden">
          <div class="title">Estimate</div>
          <div class="estimate-message">Days to path completion: <span class="completion-estimate"></span></div>
          <div class="disclaimer">Disclaimer: Paths and Course lengths may not be up to date.</div>
        </div>
      </div>
    </section>
    </div>
  </body>
</html>
